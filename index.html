<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tilt Ball Game</title>
    <style>
        /* CSS Styling */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2c3e50;
            color: white;
            font-family: Arial, sans-serif;
            touch-action: none; /* Prevents screen scrolling on touch */
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
        }
        button {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background-color: #e74c3c;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        #instructions {
            margin-top: 20px;
            text-align: center;
            font-size: 16px;
            line-height: 1.5;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <!-- User Interface for Permissions/Start -->
    <div id="ui-layer">
        <button id="start-btn">Start Game</button>
        <div id="instructions">
            Tap to enable tilt controls.<br>
            Rotate your phone to move the ball.<br>
            (Use Arrow Keys if testing on desktop)
        </div>
    </div>

    <!-- The Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <script>
        // JavaScript Game Logic
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiLayer = document.getElementById('ui-layer');
        const startBtn = document.getElementById('start-btn');

        // Set canvas to full screen
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Ball properties
        let ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 25,
            vx: 0, // velocity X
            vy: 0, // velocity Y
            ax: 0, // acceleration X
            ay: 0, // acceleration Y
            friction: 0.95, // slows the ball down slightly over time
            bounce: -0.6 // bounciness off walls
        };

        // Track keyboard inputs for desktop fallback
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        // Handle device orientation (tilt)
        function handleOrientation(event) {
            // event.gamma is the left-to-right tilt in degrees
            // event.beta is the front-to-back tilt in degrees
            let tiltX = event.gamma; 
            let tiltY = event.beta;

            // Cap the tilt values so the ball doesn't accelerate infinitely fast
            if (tiltX > 90) tiltX = 90;
            if (tiltX < -90) tiltX = -90;
            if (tiltY > 90) tiltY = 90;
            if (tiltY < -90) tiltY = -90;

            // Convert tilt into acceleration
            ball.ax = tiltX * 0.05;
            ball.ay = tiltY * 0.05;
        }

        // Request permission for accelerometer (required for iOS 13+)
        function initGame() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        } else {
                            alert("Permission denied. You can still use arrow keys on a keyboard.");
                        }
                    })
                    .catch(console.error);
            } else {
                // Non-iOS 13+ devices
                window.addEventListener('deviceorientation', handleOrientation);
            }
            
            // Hide the UI overlay and start the game loop
            uiLayer.style.display = 'none';
            gameLoop();
        }

        startBtn.addEventListener('click', initGame);

        // Main game loop
        function gameLoop() {
            // 1. Update logic
            
            // Apply keyboard fallback acceleration if tilt isn't being used
            if (keys.ArrowLeft) ball.ax = -2;
            else if (keys.ArrowRight) ball.ax = 2;
            else if (ball.ax === -2 || ball.ax === 2) ball.ax = 0; // Reset if keyboard was released

            if (keys.ArrowUp) ball.ay = -2;
            else if (keys.ArrowDown) ball.ay = 2;
            else if (ball.ay === -2 || ball.ay === 2) ball.ay = 0;

            // Add acceleration to velocity
            ball.vx += ball.ax;
            ball.vy += ball.ay;
            
            // Apply friction
            ball.vx *= ball.friction;
            ball.vy *= ball.friction;

            // Add velocity to position
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Handle Wall Collisions
            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius; // snap back to edge
                ball.vx *= ball.bounce; // reverse velocity & lose some energy
            } else if (ball.x + ball.radius > canvas.width) {
                ball.x = canvas.width - ball.radius;
                ball.vx *= ball.bounce;
            }

            if (ball.y - ball.radius < 0) {
                ball.y = ball.radius;
                ball.vy *= ball.bounce;
            } else if (ball.y + ball.radius > canvas.height) {
                ball.y = canvas.height - ball.radius;
                ball.vy *= ball.bounce;
            }

            // 2. Draw Graphics
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear previous frame
            
            // Draw a simple grid background
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            for(let i = 0; i < canvas.width; i+=50) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let i = 0; i < canvas.height; i+=50) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // Draw the ball
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            
            // Add a radial gradient to make the ball look 3D
            let gradient = ctx.createRadialGradient(ball.x - 5, ball.y - 5, 2, ball.x, ball.y, ball.radius);
            gradient.addColorStop(0, '#ff9a9e');
            gradient.addColorStop(1, '#fecfef');
            
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.strokeStyle = '#d4777b';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.closePath();

            // Loop the next frame
            requestAnimationFrame(gameLoop);
        }

        // Keep canvas full screen if window is resized
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
